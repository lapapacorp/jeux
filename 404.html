<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Jeu introuvable</title>
<style>
  :root { --bg: #1b2838; --bg-deep: #101822; --text: #c7d5e0; --muted: #8ba1b5; --accent: #66c0f4; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--text); font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, #1f3145 0%, var(--bg) 320px, var(--bg-deep) 100%);
    background-attachment: fixed;
  }
  main { padding: 24px; max-width: 480px; }
  .code { font-size: 90px; font-weight: 800; color: #fff; margin: 0; letter-spacing: -2px; }
  h1 { font-size: 22px; color: #fff; margin: 8px 0 14px; }
  p { line-height: 1.6; color: var(--muted); }
  a.btn {
    display: inline-block; margin-top: 22px; padding: 11px 22px; border-radius: 3px;
    background: linear-gradient(90deg, #06bfff, #2d73ff); color: #fff; text-decoration: none; font-weight: 600;
  }
  a.btn:hover { filter: brightness(1.12); }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Ce jeu-là n'est dans aucune bibliothèque</h1>
  <p>La page que tu cherches a dû se faire looter par un autre joueur, ou n'a jamais existé — un peu comme cette rareté légendaire que personne n'a jamais drop.</p>
  <a class="btn" href="index.html">Retourner voir les jeux offerts</a>
</main>
</body>
</html>
